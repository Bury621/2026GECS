packDir: .pack/Keil/STM32F4xx_DFP.2.14.0
srcDirs:
  - ../App
  - ../Hardware
  - ../Middleware
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Application
      files: []
      folders:
        - name: MDK-ARM
          files:
            - path: startup_stm32f407xx.s
          folders: []
        - name: User
          files: []
          folders:
            - name: Core
              files:
                - path: ../Core/Src/main.c
                - path: ../Core/Src/stm32f4xx_it.c
                - path: ../Core/Src/stm32f4xx_hal_msp.c
              folders: []
    - name: Drivers
      files: []
      folders:
        - name: STM32F4xx_HAL_Driver
